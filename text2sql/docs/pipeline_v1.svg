<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #667085; }
      .lane { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.5; rx: 12; }
      .lane-title { font: 700 15px Arial, sans-serif; fill: #475467; }
      .box { fill: #ffffff; stroke: #9fb0c3; stroke-width: 1.6; rx: 10; }
      .box-blue { fill: #e9f5ff; stroke: #4a86c5; }
      .box-green { fill: #ecfdf3; stroke: #3e9f64; }
      .box-yellow { fill: #fff8e6; stroke: #c58b17; }
      .box-red { fill: #fff1f0; stroke: #c43b32; }
      .box-purple { fill: #f3efff; stroke: #8264d9; }
      .decision { fill: #ffffff; stroke: #9f7a1f; stroke-width: 1.6; }
      .text { font: 700 15px Arial, sans-serif; fill: #172033; }
      .small { font: 400 12px Arial, sans-serif; fill: #475467; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #667085; }
      .arrow { fill: none; stroke: #344054; stroke-width: 1.7; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: #667085; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .label { font: 700 12px Arial, sans-serif; fill: #344054; }
      .pill { fill: #ffffff; stroke: #d8e0eb; rx: 14; }
      .pill-text { font: 700 12px Arial, sans-serif; fill: #475467; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="880"/>

  <text class="title" x="42" y="48">Text-to-SQL V1 Pipeline</text>
  <text class="subtitle" x="42" y="74">Baseline flow: data import, schema evidence, SQL generation, validation, execution, repair, and evaluation</text>

  <rect class="lane" x="34" y="105" width="1332" height="150"/>
  <text class="lane-title" x="58" y="132">Data Preparation</text>

  <rect class="box box-blue" x="72" y="160" width="170" height="58"/>
  <text class="text" x="157" y="184" text-anchor="middle">Sales CSV</text>
  <text class="small" x="157" y="204" text-anchor="middle">200k rows</text>

  <rect class="box" x="300" y="150" width="190" height="78"/>
  <text class="text" x="395" y="177" text-anchor="middle">Import &amp; Type</text>
  <text class="small" x="395" y="197" text-anchor="middle">strip columns</text>
  <text class="small" x="395" y="214" text-anchor="middle">date / numeric / text</text>

  <rect class="box box-green" x="548" y="150" width="190" height="78"/>
  <text class="text" x="643" y="177" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="643" y="197" text-anchor="middle">product_sales</text>
  <text class="small" x="643" y="214" text-anchor="middle">admin + readonly users</text>

  <rect class="box" x="798" y="150" width="205" height="78"/>
  <text class="text" x="900.5" y="177" text-anchor="middle">Schema Profiling</text>
  <text class="small" x="900.5" y="197" text-anchor="middle">types, min/max/avg</text>
  <text class="small" x="900.5" y="214" text-anchor="middle">distinct values, aliases</text>

  <rect class="box box-yellow" x="1064" y="150" width="205" height="78"/>
  <text class="text" x="1166.5" y="177" text-anchor="middle">Schema Summary</text>
  <text class="small" x="1166.5" y="197" text-anchor="middle">compact metadata</text>
  <text class="small" x="1166.5" y="214" text-anchor="middle">table + columns + evidence</text>

  <path class="arrow" d="M 242 189 L 300 189"/>
  <path class="arrow" d="M 490 189 L 548 189"/>
  <path class="arrow" d="M 738 189 L 798 189"/>
  <path class="arrow" d="M 1003 189 L 1064 189"/>

  <rect class="lane" x="34" y="285" width="1332" height="180"/>
  <text class="lane-title" x="58" y="312">Prompt Construction &amp; Generation</text>

  <rect class="box box-yellow" x="82" y="338" width="220" height="86"/>
  <text class="text" x="192" y="365" text-anchor="middle">Schema Context</text>
  <text class="small" x="192" y="385" text-anchor="middle">CREATE TABLE style</text>
  <text class="small" x="192" y="402" text-anchor="middle">sample values + ranges</text>

  <rect class="box box-purple" x="368" y="338" width="220" height="86"/>
  <text class="text" x="478" y="365" text-anchor="middle">Prompt Contract</text>
  <text class="small" x="478" y="385" text-anchor="middle">SELECT only</text>
  <text class="small" x="478" y="402" text-anchor="middle">PostgreSQL JSON output</text>

  <rect class="box box-blue" x="654" y="338" width="220" height="86"/>
  <text class="text" x="764" y="365" text-anchor="middle">Vietnamese Question</text>
  <text class="small" x="764" y="385" text-anchor="middle">business wording</text>
  <text class="small" x="764" y="402" text-anchor="middle">aliases guide mapping</text>

  <rect class="box box-purple" x="940" y="338" width="220" height="86"/>
  <text class="text" x="1050" y="365" text-anchor="middle">LLM Generation</text>
  <text class="small" x="1050" y="385" text-anchor="middle">SQL candidate</text>
  <text class="small" x="1050" y="402" text-anchor="middle">JSON fields + explanation</text>

  <path class="arrow" d="M 1166.5 228 L 1166.5 262 L 192 262 L 192 338"/>
  <path class="arrow" d="M 302 381 L 368 381"/>
  <path class="arrow" d="M 588 381 L 654 381"/>
  <path class="arrow" d="M 874 381 L 940 381"/>

  <rect class="lane" x="34" y="495" width="1332" height="255"/>
  <text class="lane-title" x="58" y="522">Guardrails, Execution &amp; Repair</text>

  <polygon class="decision" points="95,618 165,548 235,618 165,688"/>
  <text class="text" x="165" y="612" text-anchor="middle">NO_SQL?</text>
  <text class="small" x="165" y="632" text-anchor="middle">data related?</text>

  <rect class="box box-red" x="78" y="710" width="175" height="54"/>
  <text class="text" x="165.5" y="733" text-anchor="middle">Stop</text>
  <text class="small" x="165.5" y="752" text-anchor="middle">not data-related</text>

  <rect class="box box-yellow" x="320" y="570" width="225" height="96"/>
  <text class="text" x="432.5" y="598" text-anchor="middle">SQL Validation</text>
  <text class="small" x="432.5" y="618" text-anchor="middle">parse AST</text>
  <text class="small" x="432.5" y="635" text-anchor="middle">SELECT only + allowlist</text>
  <text class="small" x="432.5" y="652" text-anchor="middle">auto LIMIT when needed</text>

  <polygon class="decision" points="635,618 705,548 775,618 705,688"/>
  <text class="text" x="705" y="612" text-anchor="middle">Valid?</text>
  <text class="small" x="705" y="632" text-anchor="middle">safe SQL?</text>

  <rect class="box box-red" x="618" y="710" width="175" height="54"/>
  <text class="text" x="705.5" y="733" text-anchor="middle">Block</text>
  <text class="small" x="705.5" y="752" text-anchor="middle">unsafe / invalid</text>

  <rect class="box box-green" x="850" y="570" width="225" height="96"/>
  <text class="text" x="962.5" y="598" text-anchor="middle">Readonly Execution</text>
  <text class="small" x="962.5" y="618" text-anchor="middle">least privilege user</text>
  <text class="small" x="962.5" y="635" text-anchor="middle">30s timeout</text>
  <text class="small" x="962.5" y="652" text-anchor="middle">max 500 result rows</text>

  <polygon class="decision" points="1168,618 1238,548 1308,618 1238,688"/>
  <text class="text" x="1238" y="612" text-anchor="middle">Exec OK?</text>
  <text class="small" x="1238" y="632" text-anchor="middle">DB result?</text>

  <rect class="box box-green" x="1138" y="710" width="200" height="54"/>
  <text class="text" x="1238" y="733" text-anchor="middle">Return Result</text>
  <text class="small" x="1238" y="752" text-anchor="middle">SQL + table + explanation</text>

  <rect class="box box-purple" x="850" y="710" width="225" height="54"/>
  <text class="text" x="962.5" y="733" text-anchor="middle">Repair Attempt</text>
  <text class="small" x="962.5" y="752" text-anchor="middle">use DB error, retry max 2</text>

  <path class="arrow" d="M 1050 424 L 1050 470 L 165 470 L 165 548"/>
  <path class="arrow" d="M 235 618 L 320 618"/>
  <path class="arrow" d="M 545 618 L 635 618"/>
  <path class="arrow" d="M 775 618 L 850 618"/>
  <path class="arrow" d="M 1075 618 L 1168 618"/>
  <path class="arrow" d="M 1238 688 L 1238 710"/>
  <path class="arrow" d="M 1168 618 L 1108 618 L 1108 737 L 1075 737"/>
  <path class="arrow-dash" d="M 850 737 L 432 737 L 432 666"/>
  <path class="arrow" d="M 165 688 L 165 710"/>
  <path class="arrow" d="M 705 688 L 705 710"/>

  <text class="label" x="250" y="604">no</text>
  <text class="label" x="176" y="704">yes</text>
  <text class="label" x="790" y="604">yes</text>
  <text class="label" x="716" y="704">no</text>
  <text class="label" x="1250" y="704">yes</text>
  <text class="label" x="1120" y="606">no</text>

  <rect class="lane" x="34" y="778" width="1332" height="72"/>
  <text class="lane-title" x="58" y="805">Evaluation Loop</text>

  <rect class="pill" x="234" y="812" width="170" height="28"/>
  <text class="pill-text" x="319" y="831" text-anchor="middle">20 test questions</text>

  <rect class="pill" x="472" y="812" width="190" height="28"/>
  <text class="pill-text" x="567" y="831" text-anchor="middle">generated vs gold result</text>

  <rect class="pill" x="730" y="812" width="230" height="28"/>
  <text class="pill-text" x="845" y="831" text-anchor="middle">valid / success / accuracy</text>

  <rect class="pill" x="1028" y="812" width="190" height="28"/>
  <text class="pill-text" x="1123" y="831" text-anchor="middle">unsafe block rate</text>

  <path class="arrow-dash" d="M 1238 764 L 1238 826 L 1218 826"/>
  <path class="arrow-dash" d="M 234 826 L 145 826 L 145 548"/>
  <path class="arrow" d="M 404 826 L 472 826"/>
  <path class="arrow" d="M 662 826 L 730 826"/>
  <path class="arrow" d="M 960 826 L 1028 826"/>
</svg>
